<html>
  <head>
    <title>RA com AR.js e A-frame – Objetos Simples</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <a-scene vr-mode-ui="enabled: false" embedded arjs="debugUIEnabled: false">

      <a-marker preset="hiro">

        <a-box position="0 0.5 0" material="color: green"></a-box>

        <a-box position="-2.5 0.2 0" width="2" height="0.4" depth="0.8"
               material="color: #e74c3c"></a-box>

        <a-box position="2.5 0.5 0" width="2.5" height="1" depth="0.9"
               material="color: #f39c12"></a-box>

        <a-cylinder position="0 0.3 -2.5" radius="0.15" height="0.6"
                    material="color: #7d4f23"></a-cylinder>
        <a-cone position="0 1.1 -2.5" radius-bottom="0.5" height="0.9"
                material="color: #27ae60"></a-cone>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
